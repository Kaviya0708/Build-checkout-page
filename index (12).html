<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f6f9;
    padding:30px;
}

.container{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:25px;
}

/* Checkout Form */
.checkout-form,
.order-summary{
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

h2{
    margin-bottom:20px;
    color:#111827;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    outline:none;
}

textarea{
    resize:none;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

/* Order Summary */
.product{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.total{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
}

.checkout-btn{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    background:#2563eb;
    color:#fff;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

.checkout-btn:hover{
    background:#1d4ed8;
}

/* Responsive */
@media(max-width:768px){
    .container{
        grid-template-columns:1fr;
    }

    .row{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<div class="container">

    <!-- Checkout Form -->
    <div class="checkout-form">

        <h2>Billing Details</h2>

        <form>

            <div class="row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" placeholder="John">
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" placeholder="Doe">
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="john@example.com">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="+91 9876543210">
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea rows="4" placeholder="Enter delivery address"></textarea>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" placeholder="Chennai">
                </div>

                <div class="form-group">
                    <label>Pincode</label>
                    <input type="text" placeholder="600001">
                </div>
            </div>

            <div class="form-group">
                <label>Payment Method</label>
                <select>
                    <option>Credit Card</option>
                    <option>Debit Card</option>
                    <option>UPI</option>
                    <option>Cash on Delivery</option>
                </select>
            </div>

        </form>

    </div>

    <!-- Order Summary -->
    <div class="order-summary">

        <h2>Order Summary</h2>

        <div class="product">
            <span>Smartphone</span>
            <span>$500</span>
        </div>

        <div class="product">
            <span>Wireless Headphones</span>
            <span>$150</span>
        </div>

        <div class="product">
            <span>Smart Watch</span>
            <span>$250</span>
        </div>

        <div class="product">
            <span>Shipping</span>
            <span>$20</span>
        </div>

        <div class="total">
            <span>Total</span>
            <span>$920</span>
        </div>

        <button class="checkout-btn">
            Place Order
        </button>

    </div>

</div>

</body>
</html>
